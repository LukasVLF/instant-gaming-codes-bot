name: Veille officielle Codes Promo Instant Gaming

on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: veille-officielle-codes-promo
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Surveiller les annonces officielles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python veille_codes.py
      - name: Memoriser les annonces examinees
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veille_codes_state.json
          if ! git diff --staged --quiet; then
            git commit -m 'Mise a jour de la veille codes promo'
            git push
          fi
